<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="atlas-hero-title atlas-hero-desc">
  <title id="atlas-hero-title">Atlas 知识库工作台</title>
  <desc id="atlas-hero-desc">Atlas 是自托管的本机知识库工作台。左侧为项目名称与一句话说明；右侧是本机直读链路示意图：浏览器访问 127.0.0.1:4317 上的 Atlas 服务，服务直接读取本机 notes/ 与 resources/ 目录，不上传、不落库。</desc>

  <defs>
    <style>
      .display { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Songti SC', 'STSong', serif; }
      .sans    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono    { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="#f7f7f2" stroke="#d8d8cf"/>

  <g id="title-block">
    <text x="64" y="74" class="mono" font-size="18" letter-spacing="2.4" fill="#686861">自托管 · 本机直读 · 登录保护</text>

    <text x="62" y="172" class="display" font-size="76" font-weight="700" letter-spacing="-2.6" fill="#171715">Atlas</text>
    <rect x="64" y="188" width="300" height="12" fill="#ffd84d"/>

    <text x="64" y="240" class="sans" font-size="32" font-weight="650" letter-spacing="-0.4" fill="#171715">知识库工作台</text>

    <text x="64" y="286" class="sans" font-size="20" fill="#53534e">直接读取本机 Markdown 目录，浏览、检索与在线编辑。</text>
    <text x="64" y="314" class="sans" font-size="20" fill="#53534e">笔记与附件始终留在本机，服务只监听回环地址。</text>

    <text x="64" y="356" class="mono" font-size="17" fill="#686861">Node.js 18+   ·   仅测试依赖 jsdom   ·   MIT</text>
  </g>

  <g id="read-path" transform="translate(668 56)">
    <rect x="0.5" y="0.5" width="467" height="267" rx="14" fill="#fdfdf9" stroke="#d8d8cf"/>
    <text x="24" y="36" class="mono" font-size="16" letter-spacing="1.4" fill="#686861">本机直读链路</text>

    <rect x="24" y="56" width="104" height="44" rx="9" fill="#efefe8" stroke="#d8d8cf"/>
    <text x="76" y="84" class="sans" font-size="20" text-anchor="middle" fill="#171715">浏览器</text>

    <path d="M136 78 H180" stroke="#171715" stroke-width="1.4"/>
    <path d="M180 78 l-7 -4.5 v9 z" fill="#171715"/>

    <rect x="192" y="56" width="252" height="44" rx="9" fill="#efefe8" stroke="#d8d8cf"/>
    <text x="318" y="84" class="mono" font-size="18" text-anchor="middle" fill="#171715">127.0.0.1:4317</text>

    <path d="M318 102 V144" stroke="#171715" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="330" y="130" class="mono" font-size="17" fill="#686861">fs 读取</text>

    <rect x="24" y="146" width="420" height="44" rx="9" fill="#fff0a8" stroke="#d8d8cf"/>
    <text x="234" y="174" class="mono" font-size="18" text-anchor="middle" fill="#171715">notes/    resources/    .trash/</text>

    <path d="M24 210 H444" stroke="#d8d8cf" stroke-width="1"/>
    <text x="24" y="246" class="sans" font-size="19" fill="#53534e">文件留在本机，不上传、不落库。</text>
  </g>
</svg>
