<style>
/* ================= 白纸油墨基线 · 语义 token ================= */
:root {
  color-scheme: light;
  --canvas: #F7F7F2;            /* 微暖纸面 */
  --surface: #FDFDF9;           /* 卡片、输入表面 */
  --surface-subtle: #EFEFE8;    /* 次级分组与工具区 */
  --surface-inverse: #171715;   /* 局部反色（代码块） */
  --text-primary: #171715;      /* 近黑油墨 */
  --text-secondary: #53534E;
  --text-subtle: #76766F;
  --border: #D8D8CF;
  --border-strong: #171715;
  --accent: #FFD84D;           /* 荧光黄：选中、划线、小面积强调 */
  --accent-tint: #FFF0A8;
  --on-accent: #171715;
  --focus: #315EFB;             /* 键盘焦点，独立于品牌色 */
  --ease-editorial: cubic-bezier(0.19, 1, 0.22, 1);
  --radius-card: 12px;
  --radius-control: 8px;
  --radius-badge: 999px;
  --font: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sidebar-w: 252px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { touch-action: pan-x pan-y; }
body {
  font-family: var(--font);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  /* 微暖纸面 + 34px 正交细网格（约 3.5% 油墨）+ 首屏极淡黄色径向洗色 */
  background:
    radial-gradient(ellipse 860px 420px at 50% -120px, rgba(255, 216, 77, 0.10), transparent 70%),
    linear-gradient(rgba(23, 23, 21, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23, 23, 21, 0.035) 1px, transparent 1px),
    var(--canvas);
  background-size: auto, 34px 34px, 34px 34px, auto;
  background-attachment: fixed;
}
::selection { background: var(--accent); color: var(--on-accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* ================= 顶栏 ================= */
header {
  position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
  display: flex; align-items: center; gap: 16px; padding: 0 24px;
  background: var(--canvas);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand b { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-primary); }
.brand span { font-family: var(--mono); font-size: 10.5px; color: var(--text-subtle); letter-spacing: 0.08em; }
.searchbox { flex: 1; max-width: 520px; position: relative; }
.searchbox svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.5; color: var(--text-subtle); }
.searchbox input {
  width: 100%; height: 36px; padding: 0 14px 0 36px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-control);
  color: var(--text-primary); font-size: 13px; font-family: var(--font); outline: none;
  transition: border-color .16s;
}
.searchbox input:focus { border-color: var(--focus); }
.searchbox input::placeholder { color: var(--text-subtle); }
.searchbox kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 10px; color: var(--text-subtle);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: var(--surface);
}
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.stat { font-family: var(--mono); font-size: 11px; color: var(--text-subtle); white-space: nowrap; }
.stat b { color: var(--text-secondary); font-weight: 600; }
.btn-ghost {
  height: 32px; padding: 0 14px; border-radius: var(--radius-control); cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary);
  font-size: 12.5px; font-family: var(--font); transition: all .16s;
}
.btn-ghost:hover { border-color: var(--border-strong); color: var(--text-primary); }

/* ================= 布局 ================= */
.layout { display: flex; padding-top: 56px; min-height: 100vh; }
aside {
  width: var(--sidebar-w); flex-shrink: 0;
  position: fixed; top: 56px; bottom: 0; left: 0;
  display: flex; flex-direction: column; overflow: hidden;
  padding: 20px 14px 0;
  border-right: 1px solid var(--border);
}
#nav-tree { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px; }

/* ================= 侧栏日历 ================= */
#calendar { flex-shrink: 0; border-top: 1px solid var(--border); padding: 12px 2px 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 0 4px; }
.cal-title { font-family: var(--mono); font-size: 11px; color: var(--text-secondary); letter-spacing: 0.06em; }
.cal-nav {
  width: 24px; height: 24px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 6px; cursor: pointer; color: var(--text-secondary); font-size: 14px; line-height: 1;
  font-family: var(--font); transition: all .14s;
}
.cal-nav:hover { border-color: var(--border-strong); color: var(--text-primary); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-wd { font-family: var(--mono); font-size: 9.5px; color: var(--text-subtle); text-align: center; padding: 2px 0 4px; }
.cal-day {
  position: relative; height: 26px; border: 1px solid transparent; background: transparent;
  border-radius: 6px; cursor: pointer; font-family: var(--mono); font-size: 11px;
  color: var(--text-secondary); transition: all .12s; padding: 0 0 4px;
}
.cal-day:hover { background: var(--surface-subtle); color: var(--text-primary); }
.cal-day.today { border-color: var(--border-strong); color: var(--text-primary); }
.cal-day.sel { background: var(--accent-tint); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.cal-day .dot {
  position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: var(--text-subtle);
}
.cal-day.sel .dot { background: var(--on-accent); }
main { flex: 1; margin-left: var(--sidebar-w); padding: 28px 32px 90px; max-width: 1160px; }

/* ================= 侧栏目录 ================= */
.nav-label {
  font-family: var(--mono); font-size: 10px; color: var(--text-subtle);
  letter-spacing: 0.22em; padding: 2px 10px 8px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px 10px; border: none; background: transparent; border-radius: 6px;
  color: var(--text-secondary); font-size: 13px; font-family: var(--font); cursor: pointer;
  text-align: left; transition: background .12s, color .12s;
}
.nav-item:hover { background: var(--surface); color: var(--text-primary); }
.nav-item.active {
  background: var(--surface); color: var(--text-primary); font-weight: 650;
  box-shadow: inset 3px 0 0 var(--accent); /* 当前项：黄色指示面 */
}
.nav-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .cnt { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-subtle); }
.nav-sub { margin-left: 14px; border-left: 1px solid var(--border); padding-left: 4px; }
.nav-sub .nav-item { font-size: 12.5px; padding: 4px 8px; }

/* ================= 视图标题 ================= */
.view-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.view-head h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-primary); }
.view-head .sub { font-family: var(--mono); font-size: 11px; color: var(--text-subtle); }

/* ================= 卡片网格 ================= */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
  padding: 15px 16px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 7px;
  animation: cardIn .55s var(--ease-editorial) backwards;
  transition: transform .18s var(--ease-editorial), box-shadow .18s, border-color .18s;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } }
.card:hover {
  transform: translateY(-5px);
  border-color: var(--border-strong);
  box-shadow: 0 1px 2px rgba(23,23,21,.05), 0 10px 26px rgba(23,23,21,.08);
}
.card .c-top { display: flex; align-items: center; gap: 8px; }
.card .c-badge {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.02em;
  padding: 1.5px 8px; border-radius: var(--radius-badge); white-space: nowrap;
  border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-subtle);
  flex-shrink: 0;
}
.card .c-date { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-subtle); white-space: nowrap; }
.card .c-title {
  font-size: 15px; font-weight: 650; line-height: 1.45; color: var(--text-primary); letter-spacing: -0.005em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .c-excerpt {
  font-size: 12.5px; color: var(--text-secondary); line-height: 1.65;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  min-height: 42px;
}
.card .c-foot {
  display: flex; align-items: center; gap: 12px; margin-top: auto;
  font-family: var(--mono); font-size: 10.5px; color: var(--text-subtle);
  border-top: 1px solid var(--border); padding-top: 8px;
}

/* ================= 阅读进度条 ================= */
#progress {
  position: fixed; top: 56px; left: 0; height: 3px; width: 100%; z-index: 99;
  background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--progress, 0));
  pointer-events: none;
}

/* ================= 阅读视图 ================= */
.reader { max-width: 820px; margin: 0 auto; }
.reader-back {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
  color: var(--text-subtle); font-size: 13px; cursor: pointer; background: none; border: none;
  font-family: var(--font); padding: 4px 10px; border-radius: 6px;
}
.reader-back:hover { color: var(--text-primary); background: var(--surface); }
.reader-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.reader-meta .r-path { font-family: var(--mono); font-size: 11px; color: var(--text-subtle); }
.article {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
  padding: 44px 52px 52px;
}
.article h1, .article h2, .article h3, .article h4 {
  font-weight: 700; line-height: 1.4; color: var(--text-primary); margin: 1.6em 0 0.6em; letter-spacing: -0.01em;
}
.article h1 { font-size: 25px; margin-top: 0; }
.article h2 { font-size: 19px; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
.article h3 { font-size: 16px; }
.article h4 { font-size: 14.5px; }
.article p { margin: 0.7em 0; font-size: 14.5px; }
/* 荧光黄承担链接划线 */
.article a {
  color: var(--text-primary); text-decoration: underline;
  text-decoration-color: var(--accent); text-decoration-thickness: 2px;
  text-underline-offset: 3px; transition: background .15s;
}
.article a:hover { background: var(--accent-tint); }
.article ul, .article ol { padding-left: 1.6em; margin: 0.6em 0; }
.article li { margin: 0.3em 0; font-size: 14.5px; }
.article li::marker { color: var(--text-subtle); }
.article strong { color: var(--text-primary); font-weight: 650; }
.article blockquote {
  margin: 1em 0; padding: 8px 18px; border-left: 3px solid var(--border);
  background: var(--surface-subtle); border-radius: 0 var(--radius-control) var(--radius-control) 0; color: var(--text-secondary);
}
/* 行内代码：次级表面；代码块：局部反色表面 */
.article code {
  font-family: var(--mono); font-size: 0.86em;
  background: var(--surface-subtle); padding: 2px 6px; border-radius: 5px; color: var(--text-primary);
}
.article pre {
  background: var(--surface-inverse); border-radius: 10px;
  padding: 16px 18px; overflow-x: auto; margin: 1em 0; line-height: 1.55;
}
.article pre code { background: none; padding: 0; font-size: 13px; color: #E8E8E2; }
.article table { border-collapse: collapse; margin: 1em 0; width: 100%; font-size: 13.5px; display: block; overflow-x: auto; }
.article th, .article td { border: 1px solid var(--border); padding: 7px 13px; text-align: left; }
.article th { background: var(--surface-subtle); color: var(--text-primary); font-weight: 650; white-space: nowrap; }
.article hr { border: none; border-top: 1px solid var(--border); margin: 1.9em 0; }
.article img, .article video { max-width: 100%; border-radius: 10px; margin: 1em 0; border: 1px solid var(--border); }

/* ================= 筛选栏 ================= */
.filter-bar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 9px 14px; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
}
.f-group { display: flex; align-items: center; gap: 5px; }
.f-label { font-family: var(--mono); font-size: 10.5px; color: var(--text-subtle); margin-right: 3px; }
.f-btn {
  font-family: var(--font); font-size: 12px; padding: 2.5px 12px; cursor: pointer;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-badge);
  color: var(--text-secondary); transition: all .14s;
}
.f-btn:hover { color: var(--text-primary); background: var(--surface-subtle); }
.f-btn.on { background: var(--accent-tint); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.f-count { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-subtle); }

/* ================= 搜索结果 ================= */
.result {
  padding: 15px 18px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-card); margin-bottom: 12px; cursor: pointer;
  animation: cardIn .5s var(--ease-editorial) backwards;
  transition: transform .16s var(--ease-editorial), border-color .16s, box-shadow .16s;
}
.result:hover {
  transform: translateY(-3px); border-color: var(--border-strong);
  box-shadow: 0 1px 2px rgba(23,23,21,.05), 0 8px 20px rgba(23,23,21,.07);
}
.result .r-title { font-size: 15px; font-weight: 650; }
.result .r-dir { font-family: var(--mono); font-size: 11px; color: var(--text-subtle); margin: 4px 0 8px; }
.result .r-snippet { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin: 2px 0; }
.result mark, .result .r-title mark { background: var(--accent-tint); color: var(--text-primary); border-radius: 3px; padding: 0 2px; box-shadow: inset 0 -1.5px 0 var(--accent); }

/* ================= 在线编辑 ================= */
.editor-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.editor-bar .e-label { font-family: var(--mono); font-size: 11px; color: var(--text-subtle); letter-spacing: 0.08em; }
.editor-bar .e-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.editor {
  width: 100%; min-height: 62vh; padding: 20px 22px; resize: vertical; outline: none;
  font-family: var(--mono); font-size: 13px; line-height: 1.75; color: var(--text-primary);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
}
.editor:focus { border-color: var(--focus); }
.btn-ghost.armed { border-color: var(--border-strong); color: var(--text-primary); font-weight: 700; background: var(--surface-subtle); }

/* ================= 空态 ================= */
.empty {
  text-align: center; padding: 80px 20px; color: var(--text-subtle);
  background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-card);
}
.empty .e-icon { font-size: 30px; margin-bottom: 10px; opacity: 0.55; }
.empty p { font-family: var(--mono); font-size: 12.5px; }

/* ================= 滚动条（浅色） ================= */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #CFCFC5; border-radius: 5px; border: 3px solid var(--canvas); }
::-webkit-scrollbar-thumb:hover { background: #B8B8AC; }
::-webkit-scrollbar-track { background: transparent; }

/* 返回手势仅在拖动/收尾阶段接管面板 transform。 */
.is-swiping { transition: none !important; will-change: transform; }
.swipe-settling { transition: transform .18s var(--ease-editorial); }

/* ================= 降级 ================= */
/* 触屏：取消 hover 抬升与阴影 */
@media (hover: none) {
  .card:hover, .result:hover { transform: none; box-shadow: none; border-color: var(--border); }
}
/* 减弱动效：直接显示最终状态 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .card:hover, .result:hover { transform: none; box-shadow: none; }
  #btn-nav-refresh.on::after { animation: none !important; }
  html { scroll-behavior: auto; }
}

.mobile-nav { display: none; }
#btn-nav-search, #btn-nav-refresh { display: none; }
.searchbox { min-width: 0; }
/* 移动端专属节点：桌面端一律隐藏，JS 检测到窄屏后移除该属性再启用 */
[hidden-m] { display: none !important; }

/* ================= 响应式 =================
   768–1023px 平板：沿用侧栏 + 单列列表（原有 920px 断点下沉至此区间） */
@media (max-width: 1023px) and (min-width: 768px) {
  aside { display: none; z-index: 110; width: min(320px, 92vw); background: var(--canvas); box-shadow: 8px 0 30px rgba(0,0,0,.12); }
  aside.is-open { display: flex; }
  .mobile-nav { display: inline-flex; align-items: center; justify-content: center; }
  #btn-nav-close { flex-shrink: 0; margin-bottom: 14px; }
  header { gap: 8px; padding: 0 12px; }
  .brand span, .stat, .searchbox kbd { display: none; }
  .header-right { gap: 6px; }
  .header-right .btn-ghost { padding: 0 8px; font-size: 11px; }
  #btn-random { width: 32px; padding: 0; font-size: 0; }
  #btn-random::after { content: '↝'; font-size: 18px; }
  main { margin-left: 0; min-width: 0; width: 100%; padding: 20px 16px 60px; }
  .view-head, .f-group { flex-wrap: wrap; }
  .f-label { white-space: nowrap; }
  .filter-bar { gap: 8px; }
  .f-btn { padding: 2.5px 8px; }
  .grid { grid-template-columns: 1fr; }
  .article { padding: 26px 22px 34px; }
}

/* ================= 手机（≤767px）：移动端完整形态 =================
   顶栏双按钮 + 双列瀑布流 + 底部 tab bar + 抽屉分类 + 独立「我的」页
   状态栏由系统绘制，此处只用 env(safe-area-inset-*) 让出安全区 */
@media (max-width: 767px) {
  body { background: var(--canvas); overflow: hidden; }

  /* ---- 顶栏：左右两个圆形按钮 + 中间品牌；底部留出与内容更大的间距 ---- */
  header {
    position: relative;
    height: 62px; padding: 0 10px; gap: 6px;
    padding-top: env(safe-area-inset-top);
    height: calc(62px + env(safe-area-inset-top));
    background: var(--canvas);
    border-bottom: none;   /* 移动端不画分隔线，靠留白区分层级 */
    align-items: flex-start;
  }
  #btn-nav, #btn-nav-search, #btn-nav-refresh { margin-top: 6px; }
  #btn-nav { margin-right: auto; }   /* 品牌为绝对定位，需auto 把右侧按钮组推到边 */
  .brand { display: none; }
  .searchbox { display: none; }
  #btn-nav, #btn-nav-search, #btn-nav-refresh {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-secondary); cursor: pointer; padding: 0;
    font-size: 0; overflow: hidden;   /* 隐藏「浏览」等文字，仅留图标 */
  }
  /* 顶栏品牌：随顶栏高度居中 */
  .m-brand {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, calc(-50% + 3px));
    font-size: 17px; font-weight: 750; letter-spacing: -0.01em;
    color: var(--text-primary); pointer-events: none; white-space: nowrap;
  }

<script>
const nativeFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const response = await nativeFetch(...args);
  if (response.status === 401) { clearViewCaches(); location.replace('/login'); throw new Error('登录已过期'); }
  const method = args[1]?.method || 'GET';
  if (response.ok && (String(args[0]).startsWith('/api/doc?') && method !== 'GET' || String(args[0]) === '/auth/logout')) clearViewCaches();
  return response;
};
document.getElementById('btn-logout').addEventListener('click', async () => {
  if (!canLeaveEditor()) return;
  await fetch('/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  clearEditor();
  location.replace('/login');
});
document.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.matches('.card[role=link], .result[role=link]')) {
    event.preventDefault(); event.target.click();
  }
});
/* ============ 状态 ============ */
let allCards = [];
let treeData = null;
let dirCounts = new Map();
let countByDay = new Map();
let pendingDocHeading = null;
let nameIndex = {};   // 文件名(不含扩展) -> relPath
let route = { view: 'all', param: '' };
let mobileReturnRoute = { view: 'all', param: '' };
let mobileReaderTrail = [];
let mobileHistoryEntry = null;
let mobileHistorySequence = 0;
let mobileFeedScroll = 0;
let restoreMobileFeed = false;
let filters = { period: 'all', sort: 'new' };   // 时间段筛选 + 排序
let baseList = [];       // 当前视图基础卡片集（未应用筛选项）
let viewTitle = '', viewSub = '';
let viewEpoch = 0;
let acceptedHash = location.hash;
let editState = null;

/* 页面内缓存，不写入 localStorage/IndexedDB。每次打开文档仍校验服务器。 */
function boundedViewCache(limit, maxEntries = 20) {
  const values = new Map(); let bytes = 0;
  return {
    get(key) { const hit = values.get(key); if (hit) { values.delete(key); values.set(key, hit); } return hit?.value; },
    set(key, value, size) {
      const old = values.get(key); if (old) { bytes -= old.size; values.delete(key); }
      if (size > limit) return;
      while (values.size && (bytes + size > limit || values.size >= maxEntries)) {
        const first = values.keys().next().value; bytes -= values.get(first).size; values.delete(first);
      }
      values.set(key, { value, size }); bytes += size;
    },
    clear() { values.clear(); bytes = 0; },
  };
}
const documentViews = boundedViewCache(16 * 1024 * 1024);
const articleViews = boundedViewCache(8 * 1024 * 1024);
const pendingDocuments = new Map();
let cacheGeneration = 0;
let listMounts = new WeakMap();
function clearViewCaches() {
  cacheGeneration++; documentViews.clear(); articleViews.clear(); pendingDocuments.clear(); listMounts = new WeakMap();
}
async function fetchDocument(rel) {
  if (pendingDocuments.has(rel)) return pendingDocuments.get(rel);
  const cached = documentViews.get(rel), generation = cacheGeneration;
  const task = (async () => {
    const response = await fetch('/api/doc?path=' + encodeURIComponent(rel), cached?.etag ? { headers: { 'If-None-Match': cached.etag } } : undefined);
    if (generation !== cacheGeneration) return fetchDocument(rel);
    if (response.status === 304 && cached) return { ok: true, doc: cached.doc };
    if (!response.ok) return { ok: false };
    const doc = await response.json();
    if (generation !== cacheGeneration) return fetchDocument(rel);
    const etag = response.headers?.get('etag');
    if (etag) documentViews.set(rel, { doc, etag }, JSON.stringify(doc).length * 2);
    return { ok: true, doc };
  })();
  pendingDocuments.set(rel, task);
  try { return await task; }
  finally { if (pendingDocuments.get(rel) === task) pendingDocuments.delete(rel); }
}
function articleHTML(doc) {
  const key = JSON.stringify([AtlasReader.body(doc.content), doc.assets, doc.links, doc.links ? null : nameIndex]);
  const hit = articleViews.get(key);
  if (hit !== undefined) return hit;
  const html = AtlasReader.render(doc, { names: nameIndex, assetUrl: fileUrl });
  articleViews.set(key, html, (key.length + html.length) * 2);
  return html;
}
function listKey(list, emptyText) {
  return JSON.stringify([viewTitle, viewSub, filters, route.view === 'shared', ymdOf(Date.now()), emptyText, list]);
}
function restoreList(target, key) {
  const hit = listMounts.get(target);
  if (!hit || hit.key !== key) return false;
  if (target.firstChild !== hit.nodes[0]) target.replaceChildren(...hit.nodes);
  return true;
}
function retainList(target, key) { listMounts.set(target, { key, nodes: [...target.childNodes] }); }

const $ = (s) => document.querySelector(s);
const main = $('#main');

/* ============ 移动端适配层（≤767px，与 CSS 断点一致） ============ */
const MOBILE_MAX = 767;
// matchMedia 在 jsdom 等环境缺失，降级为不支持移动端，绝不影响主流程
const hasMq = typeof window.matchMedia === 'function';
const mq = hasMq ? window.matchMedia(`(max-width: ${MOBILE_MAX}px)`) : null;
const isMobile = () => !!mq && mq.matches;
// 桌面端保持隐藏，移动端移除标记
const mobileNodes = [...document.querySelectorAll('[hidden-m]')];
function syncMobileFlags() {
  mobileNodes.forEach(el => {
    if (isMobile()) el.removeAttribute('hidden-m'); else el.setAttribute('hidden-m', '');
  });
}
syncMobileFlags();
if (hasMq) mq.addEventListener('change', () => {
  syncMobileFlags();
  if (!editState) { renderView(); return; }
  // 断点切换时移动现有编辑节点，保留草稿、光标和正在进行的保存。
  const mobile = isMobile();
  const host = mobile ? $('#m-reader-body') : main;
  const editor = editState.editor;
  const bar = editor.previousElementSibling;
  bar.classList.toggle('m-editor-bar', mobile);
  editor.classList.toggle('m-editor', mobile);
  host.replaceChildren(bar, editor);
  $('#m-reader-body').classList.toggle('is-editing', mobile);
  $('#m-reader-shell').classList.toggle('on', mobile);
  renderSidebar();
});

/* 移动端渲染目标容器：窄屏走 #m-scroll，桌面沿用 #main */
const renderTarget = () => (isMobile() ? $('#m-scroll') : main);

/* ============ 工具 ============ */
function fmtDate(ms) {
  const d = new Date(ms);
  const now = new Date();
  const diffDays = Math.floor((now - d) / 86400000);
  const date = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  if (diffDays === 0) return '今天';
  if (diffDays === 1) return '昨天';
  if (diffDays < 7) return `${diffDays} 天前`;
  return date;
}
function fmtSize(n) { return n > 1024 ? (n/1024).toFixed(1) + ' KB' : n + ' B'; }
function ymdOf(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtNum(n) { return n >= 10000 ? (n/10000).toFixed(1) + ' 万' : String(n); }
function topCat(dir) { return dir ? dir.split('/')[0] : ''; }
/* 分类标签：中性油墨系，荧光黄只留给选中态 */
function catLabel(dir) {
  return dir ? topCat(dir).replace(/^(\d+)-/, '') : '根目录';
}
function badgeHTML(dir) {
  return `<span class="c-badge">${esc(catLabel(dir))}</span>`;
}
function fileUrl(relPath) {
  return '/files/' + relPath.split('/').map(encodeURIComponent).join('/');
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 移动端卡片：媒体区高度档位与占位色 ---------- */
/* 媒体区高度刻意不等高（竖/方/横），配合双列瀑布流维持错落感 */
const M_HUE = { '认知':18,'方法':42,'工具':190,'设计':320,'测试':258,'游戏':292,'生活':130,'阅读':350,'财务':200,'沟通':168,'系统':240 };
const M_DIMS = ['h1','h2','h3'];
function mHue(dir) {
  const top = (dir || '').split('/').filter(Boolean)[0] || '根目录';
  const key = Object.keys(M_HUE).find(k => top.includes(k));
  return M_HUE[key] ?? ((top.length * 47) % 360);
}
function mTint(dir) { return `linear-gradient(140deg, hsl(${mHue(dir)} 52% 52%), hsl(${(mHue(dir)+26)%360} 58% 42%))`; }
function mCardHTML(c, i) {
  const dim = M_DIMS[i % M_DIMS.length];
  const badge = `<span class="c-badge-n">${c.isMarkdown ? fmtNum(c.chars) + ' 字' : fmtSize(c.size)}</span>`;
  let media;
  if (c.isMarkdown && c.cover) {
    // 真实封面按原图比例显示，不裁剪。
    const dimensions = Number.isFinite(c.coverWidth) && c.coverWidth > 0 && Number.isFinite(c.coverHeight) && c.coverHeight > 0
      ? ` width="${c.coverWidth}" height="${c.coverHeight}"` : '';
    media = `<div class="c-media cover-img"><img src="${esc(c.cover)}"${dimensions} alt="" loading="lazy" decoding="async">${badge}</div>`;
  } else if (c.isMarkdown) {
    media = `<div class="c-media ${dim}"><span class="c-glyph" style="background:${mTint(c.dir)}">${esc(catLabel(c.dir).slice(0,1))}</span>${badge}</div>`;
  } else {
    media = `<div class="c-media" style="aspect-ratio:auto;padding:16px 10px"><span class="c-badge-n" style="position:static;background:var(--surface-subtle);color:var(--text-secondary)">非 Markdown</span></div>`;
  }
  return `<article class="card" role="link" tabindex="0" data-rel="${esc(c.relPath)}">
    ${media}
    <div class="c-text">
      <div class="c-title">${esc(c.title)}</div>
      <div class="c-foot">
        <span class="dot" style="background:${mTint(c.dir)}"></span>
        <span class="cat">${esc(catLabel(c.dir))}</span>
        <span class="date">${fmtDate(c.mtime)}</span>
      </div>
    </div>
  </article>`;
}

/* ============ 移动端双列瀑布流布局 ============
   卡片顺序即列表顺序，逐个放入当前较矮的一列 → 顶部先左右分列，再往下排。
   两列等宽，原位批量测量；只移动确实换列的节点，避免图片逐张加载时全量搬运。 */
function masonryColumns(grid) { return getComputedStyle(grid).getPropertyValue('--masonry-columns').trim() === '1' ? 1 : 2; }
function needsMasonryLayout(grid) { return grid.clientWidth !== grid.masonryWidth || masonryColumns(grid) !== grid.masonryColumns; }
function layoutMasonry(grid, cards) {
  if (!grid.isConnected || !isMobile()) return;
  const [left, right] = grid.children;
  const columnCount = masonryColumns(grid);
  const heights = cards.map(card => card.offsetHeight + 8);
  const columns = [[], []], totals = [0, 0];
  cards.forEach((card, i) => {
    const col = columnCount === 1 || totals[0] <= totals[1] ? 0 : 1;
    columns[col].push(card); totals[col] += heights[i];
  });
  [left, right].forEach((column, i) => {
    let cursor = column.firstElementChild;
    for (const card of columns[i]) {
      if (card === cursor) cursor = cursor.nextElementSibling;
      else column.insertBefore(card, cursor);
    }
  });
  grid.masonryWidth = grid.clientWidth;
  grid.masonryColumns = columnCount;
}
/* jsdom 等环境没有 requestAnimationFrame，退回定时器 */
const nextFrame = cb => (window.requestAnimationFrame ? requestAnimationFrame(cb) : setTimeout(cb, 16));
function scheduleMasonry(grid) {
  if (grid.masonryPending) return;
  grid.masonryPending = true;
  nextFrame(() => {
    grid.masonryPending = false;
    if (grid.isConnected && grid.masonry) layoutMasonry(grid, grid.masonry);
  });
}
function mountMasonry(grid, cards) {
  grid.masonry = cards;
  layoutMasonry(grid, cards);
  // 已知宽高提前占位；没有尺寸或加载失败时合并重排，补偿实际高度变化。
  for (const img of grid.querySelectorAll('img')) {
    if (img.complete) continue;
    const done = () => {
      img.removeEventListener('load', done); img.removeEventListener('error', done);
      scheduleMasonry(grid);
    };
    img.addEventListener('load', done, { once: true });
    img.addEventListener('error', done, { once: true });
  }
}

/* ============ 路由 ============ */
function parseHash(hash = location.hash) {
  const raw = hash.replace(/^#/, '');
  if (!raw || raw === 'all') return { view: 'all', param: '' };
  if (raw === 'shared') return { view: 'shared', param: '' };
  const split = raw.indexOf('=');
  const views = { doc: 'doc', dir: 'dir', date: 'date', q: 'search' };
  const view = views[raw.slice(0, split)];
  if (!view || split < 0) return { view: 'invalid', param: '' };
  try { return { view, param: decodeURIComponent(raw.slice(split + 1)) }; }
  catch { return { view: 'invalid', param: '' }; }
}
function setRoute(view, param = '') {
  const key = view === 'search' ? 'q' : view;
  const hash = ['all', 'shared'].includes(view) ? view : key + '=' + encodeURIComponent(param);
  if ('#' + hash !== acceptedHash) {
    if (!canLeaveEditor()) return;
    clearEditor();
  }
  location.hash = hash;
}
function isCurrentView(epoch) { return epoch === viewEpoch && location.hash === acceptedHash; }
function isDirty() { return !!editState && editState.editor.value !== editState.doc.content; }
function canLeaveEditor() {
  if (editState?.saving) {
    // 状态文案写在各自的编辑态里，桌面与移动端互不干扰
    if (editState.status) editState.status.textContent = '正在保存，请稍候';
    return false;
  }
  return !isDirty() || window.confirm('有未保存的修改，确定放弃草稿并离开？');
}
function clearEditor() { editState = null; window.onbeforeunload = null; }
function reloadDoc(relPath) {
  const epoch = ++viewEpoch;
  return renderDoc(relPath, epoch).catch(error => showViewError(error, epoch));
}
function toggleSidebar(open) {
  const returnFocus = $('#sidebar').contains(document.activeElement);
  $('#sidebar').classList.toggle('is-open', open);
  $('#btn-nav').setAttribute('aria-expanded', String(open));
  // 移动端侧栏与遮罩联动
  const mask = $('#m-mask');
  if (mask && !mask.hasAttribute('hidden-m')) mask.classList.toggle('on', open);
  if (isMobile() && open) $('#btn-nav-close').focus();
  else if (isMobile() && returnFocus) $('#btn-nav').focus();
}
$('#btn-nav').onclick = () => toggleSidebar(!$('#sidebar').classList.contains('is-open'));
$('#btn-nav-close').onclick = () => toggleSidebar(false);

/* ============ 数据加载 ============ */
async function loadCards() {
  const r = await fetch('/api/cards');
  const j = await r.json();
  allCards = j.cards;
  nameIndex = {};
  dirCounts = new Map();
  countByDay = new Map();
  for (const c of allCards) {
    const day = ymdOf(c.mtime);
    countByDay.set(day, (countByDay.get(day) || 0) + 1);
    const parts = c.dir.split('/').filter(Boolean);
    for (let i = 1; i <= parts.length; i++) {
      const dir = parts.slice(0, i).join('/');
      dirCounts.set(dir, (dirCounts.get(dir) || 0) + 1);
    }
    if (c.isMarkdown) nameIndex[c.relPath.split('/').pop().replace(/\.md$/,'').toLowerCase()] = c.relPath;
  }
  $('#stat').innerHTML = `共 <b>${allCards.length}</b> 篇 · <b>${new Set(allCards.map(c=>topCat(c.dir)).filter(Boolean)).size}</b> 个分类`;
}
async function loadTree() {
  const r = await fetch('/api/tree');
  treeData = await r.json();
}

/* ============ 侧栏 ============ */
function renderSidebar() {
  const sb = $('#nav-tree');
  // 移动端：移除「分享笔记」入口与分类计数（分享页由底栏承担）
  const lean = isMobile();
  let html = `<div class="nav-label">浏览</div>
    <button class="nav-item ${route.view==='all'?'active':''}" data-dir="">
      <span class="name">全部笔记</span>
      ${lean ? '' : `<span class="cnt">${allCards.length}</span>`}</button>
    ${lean ? '' : `<button class="nav-item ${route.view==='shared'?'active':''}" data-route="shared">
      <span class="name">分享笔记</span>
      <span class="cnt">${allCards.filter(card => card.isShared).length}</span></button>`}
    <div class="nav-label"${lean ? '' : ' style="margin-top:16px"'}>分类</div>`;
  const renderNode = (node) => {
    const cnt = dirCounts.get(node.relPath) || 0;
    html += `<button class="nav-item ${route.view==='dir'&&route.param===node.relPath?'active':''}" data-dir="${esc(node.relPath)}">
      <span class="name">${esc(node.name)}</span>
      ${lean ? '' : `<span class="cnt">${cnt}</span>`}</button>`;
    if (node.children.length) {
      html += `<div class="nav-sub">`;
      for (const ch of node.children) renderNode(ch);
      html += `</div>`;
    }
  };
  for (const node of treeData.children) renderNode(node);
  sb.innerHTML = html;
  sb.querySelectorAll('.nav-item').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.route === 'shared') { setRoute('shared'); return; }
      const d = btn.dataset.dir;
      setRoute(d ? 'dir' : 'all', d);   // 空目录 = 全部笔记，进入 all 视图
    };
  });
  renderCalendar();
}

/* ============ 侧栏日历 ============ */
let calCursor = null;   // { y, m } 当前展示月份
function renderCalendar() {
  const el = $('#calendar');
  if (!el) return;
  const now = new Date();
  if (!calCursor) calCursor = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = calCursor;
  // 按「修改日期（本地时区）」聚合文档
  const todayKey = ymdOf(now.getTime());
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;   // 周一开头
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span></span>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const cnt = countByDay.get(key) || 0;
    const cls = ['cal-day'];
    if (key === todayKey) cls.push('today');
    if (route.view === 'date' && route.param === key) cls.push('sel');
    cells += `<button class="${cls.join(' ')}" data-date="${key}" title="${cnt ? '当天更新 ' + cnt + ' 篇' : '当天没有文档'}">${d}${cnt ? '<i class="dot"></i>' : ''}</button>`;
  }
  el.innerHTML = `
    <div class="cal-head">
      <button class="cal-nav" data-step="-1" aria-label="上个月">‹</button>
      <span class="cal-title">${y} 年 ${m + 1} 月</span>
      <button class="cal-nav" data-step="1" aria-label="下个月">›</button>
    </div>
    <div class="cal-grid">
      ${['一','二','三','四','五','六','日'].map(w => `<span class="cal-wd">${w}</span>`).join('')}
      ${cells}
    </div>`;
  el.querySelectorAll('.cal-nav').forEach(btn => {
    btn.onclick = () => {
      const t = new Date(calCursor.y, calCursor.m + Number(btn.dataset.step), 1);
      calCursor = { y: t.getFullYear(), m: t.getMonth() };
      renderCalendar();
    };
  });
  el.querySelectorAll('.cal-day').forEach(btn => {
    btn.onclick = () => setRoute('date', btn.dataset.date);
  });
}

/* ============ 筛选 ============ */
function applyFilters(cards) {
  let list = cards;
  // 分享视图不参与筛选，固定按修改时间倒序
  if (route.view === 'shared') {
    return [...list].sort((a, b) => b.mtime - a.mtime);
  }
  if (filters.period !== 'all') {
    const day0 = new Date(); day0.setHours(0, 0, 0, 0);
    const ranges = {
      today: day0.getTime(),
      week: Date.now() - 7 * 86400e3,
      month: Date.now() - 30 * 86400e3,
      quarter: Date.now() - 90 * 86400e3,
    };
    const min = ranges[filters.period];
    list = list.filter(c => c.mtime >= min);
  }
  const sorters = {
    new: (a, b) => b.mtime - a.mtime,
    old: (a, b) => a.mtime - b.mtime,
    title: (a, b) => a.title.localeCompare(b.title, 'zh-CN'),
  };
  return [...list].sort(sorters[filters.sort]);
}

function filterBarHTML(count) {
  const periods = [
    ['all', '全部'], ['today', '今天'], ['week', '近 7 天'], ['month', '近 30 天'], ['quarter', '近 90 天'],
  ];
  const sorts = [['new', '最新优先'], ['old', '最早优先'], ['title', '标题 A-Z']];
  return `<div class="filter-bar">
    <div class="f-group"><span class="f-label">更新时间</span>
      ${periods.map(([v, l]) => `<button class="f-btn ${filters.period === v ? 'on' : ''}" data-f="period" data-v="${v}">${l}</button>`).join('')}
    </div>
    <div class="f-group"><span class="f-label">排序</span>
      ${sorts.map(([v, l]) => `<button class="f-btn ${filters.sort === v ? 'on' : ''}" data-f="sort" data-v="${v}">${l}</button>`).join('')}
    </div>
    <span class="f-count">${count} 篇</span>
  </div>`;
}

function refreshList() {
  const list = applyFilters(baseList);
  const emptyText = viewTitle === '分享笔记' && !baseList.length ? '暂无已分享的笔记' : '该筛选条件下没有笔记';

  if (isMobile()) { renderMobileList(list, emptyText); return; }
  const key = listKey(list, emptyText);
  if (restoreList(main, key)) return;

  const html = `
    <div class="view-head"><h1>${esc(viewTitle)}</h1><span class="sub">${esc(viewSub)}</span></div>
    ${filterBarHTML(list.length)}
    ${list.length ? `<div class="grid">${list.map((c, i) => `
      <div class="card" role="link" tabindex="0" data-rel="${esc(c.relPath)}" style="animation-delay:${Math.min(i, 24) * 80}ms">
        <div class="c-top">${badgeHTML(c.dir)}<span class="c-date">${fmtDate(c.mtime)}</span></div>
        <div class="c-title">${esc(c.title)}</div>
        <div class="c-excerpt">${esc(c.excerpt) || (c.isMarkdown ? '' : '非 Markdown 文件 · ' + fmtSize(c.size))}</div>
        <div class="c-foot">
          <span>${c.isMarkdown ? fmtNum(c.chars) + ' 字' : fmtSize(c.size)}</span>
          <span>${esc(catLabel(c.dir))} · ${esc(c.dir.split('/').slice(-1)[0] || '根目录')}</span>
        </div>
      </div>`).join('')}</div>` : emptyState(emptyText)}
  `;
  main.innerHTML = html;
  main.querySelectorAll('.card').forEach(el => {
    el.onclick = () => setRoute('doc', el.dataset.rel);
  });
  main.querySelectorAll('.f-btn').forEach(btn => {
    btn.onclick = () => {
      filters[btn.dataset.f] = btn.dataset.v;
      refreshList();
    }
  });

}

/* ============ 移动端列表渲染 ============ */
function renderMobileList(list, emptyText) {
  $('#m-viewhead').style.display = 'flex';
  $('#m-title').textContent = viewTitle;
  $('#m-sub').textContent = `${list.length} 篇`;

  // 分享页移除筛选区
  const showChips = route.view !== 'shared';
  const chips = $('#m-chips');
  chips.style.display = showChips ? 'flex' : 'none';
  if (showChips) {
    const periods = [['all','全部'],['today','今天'],['week','近 7 天'],['month','近 30 天'],['quarter','近 90 天']];
    const sorts = [['new','最新优先'],['old','最早优先'],['title','标题 A-Z']];
    chips.innerHTML =
      periods.map(([v, l]) => `<button class="m-chip ${filters.period === v ? 'on' : ''}" data-f="period" data-v="${v}">${l}</button>`).join('') +
      '<span class="m-sep"></span>' +
      sorts.map(([v, l]) => `<button class="m-chip ${filters.sort === v ? 'on' : ''}" data-f="sort" data-v="${v}">${l}</button>`).join('');
    chips.querySelectorAll('.m-chip').forEach(btn => {
      btn.onclick = () => { filters[btn.dataset.f] = btn.dataset.v; refreshList(); };
    });
  }

  const target = $('#m-scroll');
  const key = listKey(list, emptyText);
  if (!restoreList(target, key)) {
    target.innerHTML = list.length
      ? '<div class="grid m-masonry"><div class="m-col"></div><div class="m-col"></div></div>'
      : emptyState(emptyText);
    if (list.length) {
      const grid = target.firstElementChild;
      grid.firstElementChild.innerHTML = list.map((c, i) => mCardHTML(c, i)).join('');
      mountMasonry(grid, [...grid.firstElementChild.children]);
    }
    target.querySelectorAll('.card').forEach(el => {
      el.onclick = () => setRoute('doc', el.dataset.rel);
    });
    retainList(target, key);
  }
  const mountedGrid = target.querySelector('.m-masonry');
  if (mountedGrid && needsMasonryLayout(mountedGrid)) scheduleMasonry(mountedGrid);
  target.scrollTop = restoreMobileFeed ? mobileFeedScroll : 0;
  syncToTop();
}

  baseList = cards;

/* ============ 阅读视图 ============ */
async function renderDoc(relPath, epoch = ++viewEpoch) {
  if (isMobile()) return renderMobileDoc(relPath, epoch);
  main.innerHTML = emptyState('正在加载…');
  const result = await fetchDocument(relPath);
  if (!isCurrentView(epoch)) return;
  if (!result.ok) { main.innerHTML = emptyState('文档不存在或无法读取'); return; }
  const doc = result.doc;
  if (!isCurrentView(epoch)) return;
  const card = allCards.find(c => c.relPath === relPath) || {};

  if (!doc.isMarkdown) {
    const url = fileUrl('notes/' + relPath);
    main.innerHTML = `<div class="reader">
      <button class="reader-back" onclick="history.back()">← 返回</button>
      <div class="article"><h1>${esc(card.title || relPath.split('/').pop())}</h1>
        <p>${fmtSize(doc.size)} · ${esc(fmtDate(doc.mtime))}</p>
        <p><a href="${url}" target="_blank" rel="noopener">打开文件</a> · <a href="${url}" download>下载文件</a></p>
      </div></div>`;
    document.title = (card.title || relPath) + ' · Atlas';
    return;
  }
  const html = articleHTML(doc);

  const dirLabel = card.dir || relPath.split('/').slice(0, -1).join('/');
  main.innerHTML = `
    <div class="reader">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <button class="reader-back" onclick="history.back()">← 返回</button>
      <button class="btn-ghost" id="btn-share">分享文档</button>
      <button class="btn-ghost" id="btn-revoke" hidden>取消分享</button>
      ${doc.isMarkdown ? '<button class="btn-ghost" id="btn-edit">编辑</button><button class="btn-ghost" id="btn-delete">删除</button>' : ''}
      <span id="share-status" role="status" style="font-size:13px"></span>
      </div>
      <div id="share-result" hidden style="margin:12px 0"><label for="share-link">分享链接（持有链接者可直接查看当前文档及图片）</label><input id="share-link" readonly style="width:100%;padding:10px;margin-top:6px"></div>
      <div class="reader-meta">
        ${badgeHTML(dirLabel)}
        <span class="r-path">${esc(dirLabel)} / ${esc(relPath.split('/').pop())}</span>
      </div>
      <div class="article">${html}</div>
    </div>`;
  const shareEndpoint = '/api/share?path=' + encodeURIComponent(relPath);
  let shareUrl = null;
  const shareButton = $('#btn-share');
  const mounted = () => isCurrentView(epoch) && shareButton.isConnected;
  const showShare = url => { if (!mounted()) return; shareUrl = url; const current = allCards.find(card => card.relPath === relPath); if (current) current.isShared = !!url; renderSidebar(); $('#btn-revoke').hidden = !url; $('#btn-share').textContent = url ? '复制分享链接' : '分享文档'; };
  fetch(shareEndpoint).then(r => r.json()).then(result => { if (mounted()) showShare(result.url); }).catch(() => { if (mounted()) $('#share-status').textContent = '分享状态加载失败，请重试'; });
  $('#btn-share').onclick = async () => {
    const button = $('#btn-share'); button.disabled = true;
    try {
      if (!shareUrl) { const r = await fetch(shareEndpoint, { method: 'POST' }); const result = await r.json(); if (!mounted()) return; if (!r.ok) throw Error(result.error); showShare(result.url); }
      if (!mounted()) return;
      $('#share-result').hidden = false; $('#share-link').value = new URL(shareUrl, location.origin).href;
      try { await navigator.clipboard.writeText($('#share-link').value); if (!mounted()) return; $('#share-status').textContent = '链接已复制'; }
      catch { if (!mounted()) return; $('#share-link').select(); $('#share-status').textContent = '请复制下方链接'; }
    } catch(e) { if (mounted()) $('#share-status').textContent = e.message; } finally { button.disabled = false; }
  };
  $('#btn-revoke').onclick = async () => {
    const r = await fetch(shareEndpoint, { method: 'DELETE' });
    if (!mounted()) return;
    if (!r.ok) { $('#share-status').textContent = '取消分享失败，请重试'; return; }
    showShare(null); $('#share-result').hidden = true; $('#share-status').textContent = '分享已取消，原链接已失效';
  };
  if (doc.isMarkdown) {
    $('#btn-edit').onclick = () => enterEditMode(relPath, doc);
    const delBtn = $('#btn-delete');
    delBtn.onclick = async () => {
      // 两段式确认：第一次点击进入确认态，4 秒内再次点击才执行
      if (!delBtn.dataset.armed) {
        delBtn.dataset.armed = '1';
        delBtn.classList.add('armed');
        delBtn.textContent = '确认删除？（移至 .trash 可找回）';
        setTimeout(() => {
          if (delBtn.isConnected) { delete delBtn.dataset.armed; delBtn.classList.remove('armed'); delBtn.textContent = '删除'; }
        }, 4000);
        return;
      }
      delBtn.disabled = true;
      try {
        const r = await fetch('/api/doc?path=' + encodeURIComponent(relPath), { method: 'DELETE' });
        const result = await r.json();
        if (!r.ok) throw Error(result.error || '删除失败');
        await loadCards();
        if (!mounted()) return;
        const dir = relPath.split('/').slice(0, -1).join('/');
        setRoute(dir ? 'dir' : 'all', dir);
      } catch (e) {
        if (mounted()) $('#share-status').textContent = e.message;
        delBtn.disabled = false;
      }
    };
  }
  document.title = (card.title || doc.title || relPath) + ' · Atlas';
  document.documentElement.scrollTop = 0;
  if (pendingDocHeading?.path === relPath) { AtlasReader.scrollToHeading(main, pendingDocHeading.heading); pendingDocHeading = null; }
  // 文内 wiki 跳转（hash 链接）
  main.querySelectorAll('a[href^="#doc="]').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); const target = parseHash(a.getAttribute('href')); const heading = a.dataset.documentHeading; if (target.param === relPath && heading) { AtlasReader.scrollToHeading(main, heading); return; } pendingDocHeading = heading ? { path: target.param, heading } : null; setRoute(target.view, target.param); });
  });
}

}
function closeRmenu() {
  forceCloseRmenu();
}
function forceCloseRmenu() {
  clearTimeout(mDeleteTimer);
  const menu = $('#m-rmenu');
  const returnFocus = menu.contains(document.activeElement);
  menu.classList.remove('on', 'destructive');
  $('#btn-m-more').setAttribute('aria-expanded', 'false');

function toast(msg) {
  let el = $('#m-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'm-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:200;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:rgba(20,20,20,.93);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:999px;transition:all .24s;max-width:78%;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%, 0)';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translate(-50%, 10px)'; }, 1900);
}

  pushRecent({ ...card, relPath, title });

  // 分享：与桌面端同一接口，状态回写卡片
  const shareEndpoint = '/api/share?path=' + encodeURIComponent(relPath);

  // 编辑：复用桌面端 enterEditMode，仅容器与 ID 不同
  mEditAction = () => {

  // 删除：两段式确认，移入 .trash
  mDeleteAction = async () => {
    if (mDeleteArmed) {
      // 二次点击：执行删除
      forceCloseRmenu();
      if (!canLeaveEditor()) return;
      clearEditor();
      try {
        const resp = await fetch('/api/doc?path=' + encodeURIComponent(relPath), { method: 'DELETE' });
        const result = await resp.json();
        if (!resp.ok) throw Error(result.error || '删除失败');
        await loadCards();
        renderSidebar();
        if (!mounted()) return;
        mCloseReader();
        // 回到上级目录视图；该目录已空则回全部笔记
        const dir = relPath.split('/').slice(0, -1).join('/');
        const stillHas = dir && allCards.some(c => (c.dir + '/').startsWith(dir + '/'));
        setRoute(stillHas ? 'dir' : 'all', stillHas ? dir : '');
        toast('已移入 .trash，可随时找回');
      } catch (e) { if (mounted()) toast(e.message); }
      return;
    }
    // 第一次点击进入确认态，4 秒内再次点击才执行
    mDeleteArmed = true;
    mDeleteBtn.textContent = '确认删除？';
    mDeleteBtn.classList.add('armed');
    $('#m-rmenu').classList.add('destructive');
    mDeleteTimer = setTimeout(() => {
      if (!mDeleteBtn.isConnected) return;
      mDeleteArmed = false;
      mDeleteBtn.textContent = '删除文档';
      mDeleteBtn.classList.remove('armed');

}

/* ============ 在线编辑 ============ */
/* ============ 在线编辑（桌面与移动端共用） ============
   opts.host        替换正文的容器
   opts.relocate    取消编辑后如何回读（桌面 reloadDoc；移动端重渲染阅读页）
   opts.onSaved     保存成功后的额外收尾
   ID 一律加前缀，避免两套 UI 同时存在时选择器串台。 */
function enterEditMode(relPath, doc, opts = {}) {
  const host = opts.host || main;
  const relocate = opts.relocate || (() => reloadDoc(relPath));
  const article = host.querySelector('.article');
  if (!article) return;
  // 桌面沿用原ID（regression-test 等既有选择器依赖），移动端加 -m 后缀
  const ns = opts.ns === 'm' ? '-m' : '';
  const editorId = `editor${ns}`, statusId = `edit-status${ns}`;
  const saveId = `btn-save${ns}`, cancelId = opts.ns === 'm' ? 'btn-cancel-m' : 'btn-cancel-edit';
  const barClass = opts.mobile ? 'editor-bar m-editor-bar' : 'editor-bar';
  article.outerHTML = opts.mobile ? `
    <div class="${barClass}">
      <span class="e-label">编辑原文</span>
      <span id="${statusId}" class="e-status" role="status"></span>
      <span class="e-actions">
        <button class="btn-ghost" id="${saveId}">保存</button>
        <button class="btn-ghost" id="${cancelId}">取消</button>
      </span>
    </div>
    <textarea class="editor m-editor" id="${editorId}" spellcheck="false"></textarea>`
  : `
    <div class="${barClass}">
      <span class="e-label">MARKDOWN 原文编辑 · 保存即写入本机主库</span>
      <span class="e-actions">
        <span id="${statusId}" role="status" style="font-size:13px;color:var(--text-subtle)"></span>
        <button class="btn-ghost" id="${saveId}">保存</button>
        <button class="btn-ghost" id="${cancelId}">取消</button>
      </span>
    </div>
    <textarea class="editor" id="${editorId}" spellcheck="false"></textarea>`;
  const editor = host.querySelector('#' + editorId);
  const status = host.querySelector('#' + statusId);
  const saveBtn = host.querySelector('#' + saveId);
  const cancelBtn = host.querySelector('#' + cancelId);
  editor.value = doc.content;
  // 编辑期间禁用可能造成内容丢失的操作
  ['btn-share', 'btn-revoke', 'btn-edit', 'btn-delete', 'btn-m-share', 'btn-m-more'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = true;
  });
  if (opts.mobile) {
    host.classList.add('is-editing');
    host.scrollTop = 0;
    // 原文完整保留，初始光标定位正文，避开可能很长的内嵌封面元数据。
    const bodyStart = doc.content.length - AtlasReader.body(doc.content).length;
    editor.setSelectionRange(bodyStart, bodyStart);
  }
  editor.focus();
  if (opts.mobile) {
    host.scrollTop = 0;
    const bodyStart = doc.content.length - AtlasReader.body(doc.content).length;
    if (bodyStart && editor.clientWidth) {
      // 用同宽排版测量正文起点，避免长封面数据在编辑首屏占满视口。
      const measure = document.createElement('div');
      const style = getComputedStyle(editor);
      measure.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;box-sizing:border-box;';
      for (const property of ['fontFamily', 'fontSize', 'lineHeight', 'letterSpacing', 'padding']) measure.style[property] = style[property];
      measure.style.width = editor.clientWidth + 'px';
      measure.append(document.createTextNode(doc.content.slice(0, bodyStart)));
      const caret = document.createElement('span');
      caret.textContent = '|'; measure.append(caret);
      document.body.append(measure);
      editor.scrollTop = Math.max(0, caret.offsetTop - parseFloat(style.paddingTop));
      measure.remove();
    }
  }
  editState = { editor, doc, saving: false, status };
  cancelBtn.onclick = () => {
    if (!canLeaveEditor()) return;
    clearEditor();
    relocate();
  };
  saveBtn.onclick = async () => {
    const state = editState;
    if (!state || state.saving) return;
    const epoch = viewEpoch;
    const content = editor.value;
    if (!content.trim()) { status.textContent = '内容不能为空'; return; }
    if (content === doc.content) { clearEditor(); relocate(); return; }
    state.saving = true;
    editor.readOnly = true;
    saveBtn.disabled = cancelBtn.disabled = true;
    status.textContent = '保存中…';
    try {
      const r = await fetch('/api/doc?path=' + encodeURIComponent(relPath), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content, version: doc.version }),
      });
      const result = await r.json();
      if (!r.ok) throw Error(result.error || '保存失败');
      doc.content = content;
      doc.version = result.version;
      state.saving = false;
      clearEditor();
      // A refresh failure must not turn a successful save into a failed save.
      try { await Promise.all([loadCards(), loadTree()]); renderSidebar(); }
      catch { status.textContent = '已保存，列表刷新失败，请刷新页面'; }
      if (isCurrentView(epoch)) await relocate();
      opts.onSaved?.();
    } catch (e) {
      if (editor.isConnected) status.textContent = e.message;
    } finally {
      state.saving = false;
      editor.readOnly = false;
      saveBtn.disabled = cancelBtn.disabled = false;
    }
  };
  editor.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); saveBtn.click(); }
  });
  window.onbeforeunload = e => {
    if (isDirty() || editState?.saving) { e.preventDefault(); e.returnValue = ''; return ''; }
  };
}

/* ============ 搜索视图 ============ */
async function renderSearch(q, epoch = ++viewEpoch) {
  if (!q) { renderView(); return; }
  const target = renderTarget();
  if (isMobile()) {
    $('#m-chips').style.display = 'none';
    $('#m-viewhead').style.display = 'flex';
    $('#m-title').textContent = '搜索';
    $('#m-sub').textContent = `「${q}」`;
  }
  target.innerHTML = emptyState('正在搜索…');
  const r = await fetch('/api/search?q=' + encodeURIComponent(q));
  const j = await r.json();
  if (!isCurrentView(epoch)) return;
  if (isMobile()) $('#m-sub').textContent = `「${q}」 · ${j.results.length} 篇命中`;
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hl = (text) => {
    let s = esc(text);
    for (const t of terms) {
      const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      s = s.replace(re, '<mark>$1</mark>');
    }
    return s;
  };
  const results = j.results.map((res, i) => `
      <div class="result" role="link" tabindex="0" data-rel="${esc(res.relPath)}" style="animation-delay:${Math.min(i, 20) * 80}ms">
        <div class="r-title">${hl(res.title)}</div>
        <div class="r-dir">${badgeHTML(res.dir)} <span style="margin-left:6px">${esc(res.dir || '根目录')} · ${fmtDate(res.mtime)}</span></div>
        ${res.snippets.map(s => `<div class="r-snippet">…${hl(s)}…</div>`).join('')}
      </div>`).join('');
  if (!j.results.length) {
    target.innerHTML = emptyState(`没有找到与「${esc(q)}」相关的内容`);
    return;
  }
  if (isMobile()) {
    $('#m-viewhead').style.display = 'flex';
    $('#m-title').textContent = '搜索';
    $('#m-sub').textContent = `「${q}」 · ${j.results.length} 篇命中`;
  }
  target.innerHTML = (isMobile() ? '' : `
    <div class="view-head"><h1>搜索</h1><span class="sub">「${esc(q)}」 · ${j.results.length} 篇命中</span></div>`) + results;
  target.querySelectorAll('.result').forEach(el => {
    el.onclick = () => setRoute('doc', el.dataset.rel);
  });
  if (isMobile()) target.scrollTop = restoreMobileFeed ? mobileFeedScroll : 0;
}

/* ============ 阅读进度（被动 scroll + rAF 合帧，CSS 变量驱动） ============ */
let progressRAF = null;
function updateProgress() {
  if (progressRAF) return;
  progressRAF = requestAnimationFrame(() => {
    progressRAF = null;
    const el = document.documentElement;
    const max = el.scrollHeight - el.clientHeight;
    const p = max > 0 ? Math.min(1, el.scrollTop / max) : 0;
    document.getElementById('progress').style.setProperty('--progress', p);
  });
}

/* ============ 总渲染 ============ */
function showViewError(error, epoch = viewEpoch) {
  if (isCurrentView(epoch)) {
    const target = isMobile() && route.view === 'doc' ? $('#m-reader-body') : renderTarget();
    target.innerHTML = emptyState(esc(error.message || '加载失败，请重试'));

}
function renderView() {
  if (location.hash !== acceptedHash && !canLeaveEditor()) {
    history.replaceState(null, '', acceptedHash || '#all');
    return;
  }
  clearEditor();
  const nextRoute = parseHash();
  const changed = acceptedHash !== location.hash;
  let nextEntry = history.state?.atlasEntry;
  if (!nextEntry) {
    nextEntry = `${Date.now()}-${++mobileHistorySequence}`;
    history.replaceState({ ...history.state, atlasEntry: nextEntry }, '', location.href);
  }
  restoreMobileFeed = route.view === 'doc' && nextRoute.view === mobileReturnRoute.view && nextRoute.param === mobileReturnRoute.param;
  if (isMobile() && (changed || !mobileReaderTrail.length)) {
    if (nextRoute.view === 'doc') {
      if (route.view !== 'doc') {
        mobileReturnRoute = { ...route };
        mobileFeedScroll = $('#m-scroll').scrollTop;
        mobileReaderTrail = [{ ...route, native: changed, entry: mobileHistoryEntry }];
      } else {
        const index = mobileReaderTrail.findLastIndex(item => item.entry === nextEntry);
        if (index >= 0) mobileReaderTrail = mobileReaderTrail.slice(0, index);
        else if (changed) mobileReaderTrail.push({ ...route, native: true, entry: mobileHistoryEntry });
      }
    } else mobileReaderTrail = [];
  }
  acceptedHash = location.hash;
  mobileHistoryEntry = nextEntry;
  route = nextRoute;
  if (route.view !== 'doc') {
    $('#m-reader-shell').classList.remove('on');
    forceCloseRmenu();
  }
  const epoch = ++viewEpoch;
  toggleSidebar(false);
  document.title = 'Atlas · 知识库工作台';
  if (route.view === 'all') {
    renderCards(allCards, '全部笔记', `共 ${allCards.length} 个文件`);
    renderSidebar();
  } else if (route.view === 'shared') {
    const cards = allCards.filter(card => card.isShared);
    renderCards(cards, '分享笔记', `共 ${cards.length} 篇已分享`);
    renderSidebar();
  } else if (route.view === 'dir') {
    const dir = route.param;
    const cards = dir ? allCards.filter(c => (c.dir + '/').startsWith(dir + '/')) : allCards;
    const node = findNode(treeData, dir);
    renderCards(cards, node ? node.name : dir || '全部笔记', `${cards.length} 个文件`);
    renderSidebar();
  } else if (route.view === 'date') {
    const [y, m, d] = route.param.split('-').map(Number);
    calCursor = { y, m: m - 1 };
    const cards = allCards.filter(c => ymdOf(c.mtime) === route.param);
    renderCards(cards, `${m} 月 ${d} 日`, `${y} 年 · 当天更新 ${cards.length} 个文件`);
    renderSidebar();
  } else if (route.view === 'doc') {
    renderDoc(route.param, epoch).catch(error => showViewError(error, epoch));
    renderCalendar();
  } else if (route.view === 'search') {
    renderSearch(route.param, epoch).catch(error => showViewError(error, epoch));
    renderCalendar();
  } else { renderTarget().innerHTML = emptyState('链接格式无效，请从笔记列表重新打开'); }
  if (isMobile()) syncMobileTabs();
}
function findNode(root, relPath) {
  if (!relPath) return root;
  let node = root;
  for (const part of relPath.split('/')) {
    node = (node.children || []).find(c => c.name === part);
    if (!node) return null;
  }
  return node;
}

/* ---- 手机返回手势：候选 → 横向拖动 → 回弹/完成，取消永不导航 ---- */
function bindSwipeBack(el, onBack, options = {}) {
  const direction = options.direction === 'left' ? -1 : 1;
  let gesture = null, timer = null, suppressClickUntil = 0;
  const available = () => isMobile() && el.classList.contains(options.openClass || 'on') && (!options.canStart || options.canStart());
  const reset = () => {
    clearTimeout(timer); timer = null; gesture = null;
    suppressClickUntil = 0;
    el.classList.remove('is-swiping', 'swipe-settling');
    el.style.removeProperty('transform');
    el.style.removeProperty('opacity');
  };
  const draw = distance => {
    el.style.transform = `translateX(${direction * distance}px)`;
  };
  const settle = complete => {
    const current = gesture;
    if (!current || current.phase === 'settling') return;
    current.phase = 'settling';
    suppressClickUntil = Date.now() + 350;
    el.classList.remove('is-swiping');
    el.classList.add('swipe-settling');
    draw(complete ? current.width : 0);
    const duration = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 0 : 180;
    timer = setTimeout(() => {
      const valid = available() && acceptedHash === current.hash;
      reset();
      if (complete && valid) onBack();
    }, duration);
  };
  el.addEventListener('touchstart', event => {
    if (gesture || !available() || event.touches.length !== 1) { reset(); return; }
    const touch = event.touches[0], rect = el.getBoundingClientRect();
    const localX = touch.clientX - rect.left;
    if (options.edge !== false && (localX < 0 || localX > 24)) return;
    if (event.target.closest('input,textarea,select,video,[contenteditable="true"]') || (!options.allowControls && event.target.closest('button,a'))) return;
    gesture = { id: touch.identifier, x: touch.clientX, y: touch.clientY,
      width: rect.width || window.innerWidth, distance: 0, phase: 'pending', hash: acceptedHash };
  }, { passive: true });
  el.addEventListener('touchmove', event => {
    if (!gesture || gesture.phase === 'settling') return;
    if (event.touches.length !== 1 || !available() || acceptedHash !== gesture.hash) { reset(); return; }
    const touch = [...event.touches].find(item => item.identifier === gesture.id);
    if (!touch) { reset(); return; }
    const dx = direction * (touch.clientX - gesture.x), dy = Math.abs(touch.clientY - gesture.y);
    if (gesture.phase === 'pending') {
      if (Math.max(Math.abs(dx), dy) < 10) return;
      if (dx <= 0 || dx < dy * 1.5 || !event.cancelable) { reset(); return; }
      gesture.phase = 'dragging';
      el.classList.add('is-swiping');
    }
    if (!event.cancelable) { reset(); return; }
    event.preventDefault();
    gesture.distance = Math.min(Math.max(0, dx), gesture.width);
    draw(gesture.distance);
  }, { passive: false });
  el.addEventListener('touchend', event => {
    if (!gesture || gesture.phase === 'settling') return;
    const touch = [...event.changedTouches].find(item => item.identifier === gesture.id);
    if (!touch) return;
    if (gesture.phase !== 'dragging') { reset(); return; }
    const dx = direction * (touch.clientX - gesture.x);
    const threshold = Math.min(120, Math.max(64, gesture.width * .25));
    settle(dx >= threshold && Math.abs(touch.clientY - gesture.y) < dx / 1.5);
  }, { passive: true });
  el.addEventListener('touchcancel', reset, { passive: true });
  el.addEventListener('click', event => {
    if (Date.now() < suppressClickUntil) { event.preventDefault(); event.stopPropagation(); }
  }, true);
  for (const event of ['resize', 'blur', 'pagehide', 'hashchange']) window.addEventListener(event, reset);
  document.addEventListener('visibilitychange', reset);
  return reset;
}
bindSwipeBack($('#m-reader-shell'), mCloseReader, {

window.addEventListener('resize', () => {
  const grid = $('#m-scroll .m-masonry');
  if (grid && grid.masonry && needsMasonryLayout(grid)) scheduleMasonry(grid);
});
$('#m-search-cancel').onclick = closeAllOverlays;
$('#m-mask').onclick = closeAllOverlays;
$('#btn-m-back').onclick = mCloseReader;
$('#btn-m-more').onclick = e => {
  e.stopPropagation();
  const menu = $('#m-rmenu');
  if (menu.classList.contains('on')) { forceCloseRmenu(); return; }
  menu.classList.add('on');

};
$('#btn-m-share').onclick = () => mShareAction?.();
$('#m-rmenu').onclick = e => e.stopPropagation();
document.addEventListener('click', () => closeRmenu());
$('#m-rm-edit').onclick = () => mEditAction?.();
$('#m-rm-copy').onclick = () => mCopyAction?.();

/* 移动端搜索输入 */
$('#m-search-input').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim();
  if (!q) return;
  closeAllOverlays();
  setRoute('search', q);
});
/* 桌面搜索框在移动端隐藏，同步清空以免残留 */
$('#search-input').addEventListener('input', e => {
  if (isMobile()) { e.target.value = ''; return; }
});

/* ---- 新建空白 Markdown ---- */
async function createDoc() {
  const title = (prompt('新建笔记 · 请输入标题（不含 .md）') || '').trim();
  if (!title) return;
  if (/[\\/]/.test(title)) return toast('标题不能包含路径分隔符');
  if (title.length > 120) return toast('标题过长');
  const rel = `新建/${title}.md`;
  const r = await fetch('/api/doc?path=' + encodeURIComponent(rel), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title }),
  });
  const result = await r.json();
  if (!r.ok) return toast(result.error || '创建失败');
  await Promise.all([loadCards(), loadTree()]);
  renderSidebar();
  setRoute('doc', result.relPath);
  toast('已创建空白文档');
}

/* ---- 我的（独立页）---- */
const RECENT_KEY = 'atlas.mobile.recent';
function pushRecent(card) {
  if (!isMobile() || !card) return;
  let list = [];
  try { list = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch {}
  list = list.filter(r => r.relPath !== card.relPath);
  list.unshift({ relPath: card.relPath, title: card.title, at: Date.now() });
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 8))); } catch {}
}
function openMe() {
  renderMe();
  $('#m-mepage').classList.add('on');
}
$('#btn-me-back').onclick = () => $('#m-mepage').classList.remove('on');
function renderMe() {
  const host = $('#m-me-body');
  const md = allCards.filter(c => c.isMarkdown);
  const today = ymdOf(Date.now());
  const chars = md.reduce((s, c) => s + (c.chars || 0), 0);
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch {}
  host.innerHTML = `
    <div class="m-grp">账户</div>
    <div class="m-profile">
      <div class="av">${esc((mAuth.username || 'A').slice(0, 1).toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(mAuth.username || '未登录')}</div>
        <div class="sub2">${esc(mAuth.sessionText)}</div>
      </div>
      <button class="m-logout" data-act="logout" aria-label="退出登录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><path d="M10 12h10M17 9l3 3-3 3"/></svg>
      </button>
    </div>
    <div class="m-grp">统计</div>
    <div class="m-grid3">
      <div class="m-stat"><b>${allCards.length}</b><span>笔记</span></div>
      <div class="m-stat"><b>${new Set(allCards.map(c => topCat(c.dir)).filter(Boolean)).size}</b><span>分类</span></div>
      <div class="m-stat"><b>${allCards.filter(c => c.isShared).length}</b><span>已分享</span></div>
    </div>
    <div class="m-grid3">
      <div class="m-stat"><b>${fmtNum(chars)}</b><span>总字数</span></div>
      <div class="m-stat"><b>${allCards.filter(c => ymdOf(c.mtime) === today).length}</b><span>今日更新</span></div>
      <div class="m-stat"><b>${allCards.filter(c => !c.isMarkdown).length}</b><span>非MD</span></div>
    </div>
    <div class="m-grp">最近浏览</div>
    ${recent.length ? recent.map(r => `<button class="m-it" data-rel="${esc(r.relPath)}"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</span><span class="ct">${fmtDate(r.at)}</span></button>`).join('') : '<div class="m-empty">暂无浏览记录</div>'}`;
  host.querySelectorAll('.m-it[data-rel]').forEach(b => {
    b.onclick = () => { $('#m-mepage').classList.remove('on'); setRoute('doc', b.dataset.rel); };
  });
  const logoutBtn = host.querySelector('[data-act="logout"]');
  if (logoutBtn) logoutBtn.onclick = async () => {
    if (!confirm('确定退出登录？')) return;
    await fetch('/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    clearEditor();
    location.replace('/login');
  };
}
/* 登录态（读 /auth/status，含 username 与会话过期时间） */
const mAuth = { username: null, expiresAt: null, sessionText: '' };
async function loadAuth() {
  try {
    const r = await fetch('/auth/status');
    const j = await r.json();
    mAuth.username = j.username;
    mAuth.expiresAt = j.expiresAt;
    if (!j.authenticated) mAuth.sessionText = '未登录';
    else {
      const left = Math.max(0, Math.floor(((j.expiresAt || 0) - Date.now()) / 60000));
      mAuth.sessionText = left > 90 ? `已登录 · 会话剩余 ${Math.floor(left / 60)} 小时` : `已登录 · 会话剩余 ${left} 分钟`;
    }
  } catch {
    mAuth.sessionText = '状态获取失败';
  }
}

/* ============ 启动 ============ */
(async function init() {
  renderTarget().innerHTML = emptyState('正在加载笔记…');
  const directDoc = parseHash().view === 'doc';
  try {
    const data = Promise.all([loadCards(), loadTree()]);
    if (directDoc) renderView();
    await data;
    if ((directDoc && route.view === 'doc') || editState) renderSidebar();
    else renderView();
  }
  catch (error) { showViewError(error); }
  if (isMobile()) loadAuth();
})();
</script>
